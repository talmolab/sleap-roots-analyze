name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/sleap_roots_analyze/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run Black
        run: uv run black --check src/sleap_roots_analyze tests

      - name: Run Ruff
        run: uv run ruff check src/sleap_roots_analyze

  reproducibility-gates:
    name: Reproducibility gates (determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      # Determinism is a same-machine double-run comparison, so a single OS is the
      # correct, achievable claim (cross-OS bit-identity is not guaranteed by NumPy
      # /BLAS). Own job so it can be a required status check in branch protection.
      - name: Run determinism sweep
        run: uv run pytest tests/test_reproducibility.py

  serialization-gate:
    name: Serialization round-trip gate
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      # Serialization is NOT OS-independent — Path -> str differs by OS
      # (WindowsPath uses backslashes), exactly the class of bug this gate exists to
      # catch — so the round-trip runs on the full OS matrix.
      - name: Run result-object serialization round-trip
        run: uv run pytest tests/test_result_serialization.py -rs

  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "windows", "mac"]
        include:
          - os: ubuntu
            runs-on: ubuntu-latest
          - os: windows
            runs-on: windows-latest
          - os: mac
            runs-on: macos-14
        python: [3.11]

    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        if: matrix.os != 'self-hosted-gpu'
        run: uv python install ${{ matrix.python }}

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Print environment info
        run: |
          echo "=== UV Environment ==="
          uv run python --version
          uv run python -c "import sys; print('Python executable:', sys.executable)"
          echo "=== UV Environment NumPy Check ==="
          uv run python -c "import numpy; print('NumPy version:', numpy.__version__); print('NumPy location:', numpy.__file__)" || echo "NumPy import failed in uv environment"
          echo "=== UV pip list ==="
          uv pip list
          echo "=== UV ENVIRONMENT CHECK ==="
          uv run python -c "import os; print('VIRTUAL_ENV:', os.environ.get('VIRTUAL_ENV', 'Not set'))"
          uv run python -c "import sys; print('sys.prefix:', sys.prefix)"

      - name: Run pytest
        run: |
          echo "=== Running pytest ==="
          echo "Skipping integration tests (marked with @pytest.mark.integration) - see issue #69"
          uv run pytest --cov=src/sleap_roots_analyze --cov-report=xml --durations=20 -m "not integration" tests/

    #   - name: Upload coverage
    #     uses: codecov/codecov-action@v5
    #     with:
    #       fail_ci_if_error: true
    #       verbose: false
    #       token: ${{ secrets.CODECOV_TOKEN }}