name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/sleap_roots_analyze/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      # so a debt-paydown PR that only edits the baseline still runs the gate
      - ".mypy-baseline.txt"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run Black
        run: uv run black --check src/sleap_roots_analyze tests

      - name: Run Ruff
        run: uv run ruff check src/sleap_roots_analyze

  type-check:
    name: Type check (mypy baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      # --frozen: install exactly the locked toolchain so the baseline (generated
      # against locked mypy + inline-typed numpy/pandas) can't drift off the lock.
      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      # Type checking is OS-independent, so one OS is sufficient. Own job so it can be a
      # required status check in branch protection. Pre-existing errors are frozen in
      # .mypy-baseline.txt; `filter` exits non-zero only on NEW errors (or a stale baseline
      # whose recorded errors no longer reproduce). See issue #132 + docs/CONTRIBUTING.md.
      - name: Run mypy against frozen baseline
        shell: bash
        # pipefail is ON by default in Actions; mypy always exits non-zero while the
        # baseline holds errors, so disable it and let `filter`'s exit code (non-zero only
        # on NEW errors) decide pass/fail. That safety only holds while the baseline is
        # non-empty though: once it's paid down to zero, a mypy crash that emits nothing
        # looks identical to a clean run. Guard against that (issue #160) by capturing
        # mypy's own exit code via PIPESTATUS and failing on anything outside {0, 1}
        # (0=clean, 1=errors reported — mypy's documented convention; anything else is a
        # fatal/usage/internal error or a signal kill). PIPESTATUS must be copied into a
        # plain array in the very next statement — reading its elements as two separate
        # statements loses the second one, since bash resets PIPESTATUS after every
        # subsequent simple command.
        run: |
          set +o pipefail
          uv run mypy src/sleap_roots_analyze | uv run mypy-baseline filter --baseline-path .mypy-baseline.txt
          status=("${PIPESTATUS[@]}")
          mypy_status="${status[0]}"
          filter_status="${status[1]}"
          if [[ "$mypy_status" != "0" && "$mypy_status" != "1" ]]; then
            echo "::error::mypy exited with fatal status $mypy_status (expected 0=clean or 1=errors-found); treating as a crash, not a baseline diff."
            exit 1
          fi
          exit "$filter_status"

  reproducibility-gates:
    name: Reproducibility gates (determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      # Determinism is a same-machine double-run comparison, so a single OS is the
      # correct, achievable claim (cross-OS bit-identity is not guaranteed by NumPy
      # /BLAS). Own job so it can be a required status check in branch protection.
      - name: Run determinism sweep
        run: uv run pytest tests/test_reproducibility.py

  numerical-stability:
    name: Numerical-stability gate (golden drift)
    # macOS because the golden is generated on macOS (arm64) and UMAP is not
    # bit-reproducible across operating systems / BLAS backends; the gate's tolerances
    # (Procrustes atol=1e-6, frame rtol=1e-10) are tighter than the cross-OS float floor.
    # This is a DRIFT detector (golden vs committed), NOT a determinism double-run — its
    # single-OS rationale differs from the determinism gate above, so it is its own job
    # (mirroring the serialization-gate precedent) and can be a required status check.
    # The test self-skips on non-macOS, so the cross-OS `tests` matrix stays green.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run numerical-stability gate
        run: uv run pytest tests/test_numerical_stability.py -rs

  serialization-gate:
    name: Serialization round-trip gate
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --group dev

      # Serialization is NOT OS-independent — Path -> str differs by OS
      # (WindowsPath uses backslashes), exactly the class of bug this gate exists to
      # catch — so the round-trip runs on the full OS matrix.
      - name: Run result-object serialization round-trip
        run: uv run pytest tests/test_result_serialization.py -rs

  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "windows", "mac"]
        include:
          - os: ubuntu
            runs-on: ubuntu-latest
          - os: windows
            runs-on: windows-latest
          - os: mac
            runs-on: macos-14
        python: [3.11]

    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        if: matrix.os != 'self-hosted-gpu'
        run: uv python install ${{ matrix.python }}

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Print environment info
        run: |
          echo "=== UV Environment ==="
          uv run python --version
          uv run python -c "import sys; print('Python executable:', sys.executable)"
          echo "=== UV Environment NumPy Check ==="
          uv run python -c "import numpy; print('NumPy version:', numpy.__version__); print('NumPy location:', numpy.__file__)" || echo "NumPy import failed in uv environment"
          echo "=== UV pip list ==="
          uv pip list
          echo "=== UV ENVIRONMENT CHECK ==="
          uv run python -c "import os; print('VIRTUAL_ENV:', os.environ.get('VIRTUAL_ENV', 'Not set'))"
          uv run python -c "import sys; print('sys.prefix:', sys.prefix)"

      - name: Run pytest
        run: |
          echo "=== Running pytest ==="
          echo "Skipping integration tests (marked with @pytest.mark.integration) - see issue #69"
          uv run pytest --cov=src/sleap_roots_analyze --cov-report=xml --durations=20 -m "not integration" tests/

    #   - name: Upload coverage
    #     uses: codecov/codecov-action@v5
    #     with:
    #       fail_ci_if_error: true
    #       verbose: false
    #       token: ${{ secrets.CODECOV_TOKEN }}