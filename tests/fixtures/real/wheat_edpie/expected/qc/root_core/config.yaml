pipeline_name: edpie_root_core_qc
version: '1.0'
enable_parallel: false
root_core:
  sources:
  - csv_path: C:/Users/Elizabeth/Desktop/phenotyping/EDPIE_paper/data/root_coring/rearranged_root_biomass_dw.csv
    data_type: biomass
    depth_column_prefix: RootDW
    value_column_name: Root_DW_g
    aggregation_method: median
    depth_mapping:
      0-30: 15.0
      30-60: 45.0
    depth_range_mapping:
      15.0: 0-30
      45.0: 30-60
    genotype_column: salk_geno
  - csv_path: C:/Users/Elizabeth/Desktop/phenotyping/EDPIE_paper/data/root_coring/root_counting_cimmyt_edited.csv
    data_type: counting
    depth_column_prefix: RootCount
    value_column_name: Root_Count
    aggregation_method: median
    depth_mapping: null
    depth_range_mapping: null
    genotype_column: geno
  core_qc:
    enabled: true
    max_missing_proportion: 0.5
    remove_outliers: true
    detect_value_outliers: false
    max_deviation_from_median: 0.3
    min_cores_after_qc: 1
  merge_traits:
    above_ground_csv: C:/Users/Elizabeth/Desktop/phenotyping/EDPIE_paper/data/field/Field_2024_aboveground.csv
    join_keys:
    - Rep
    - geno
    join_type: inner
    duplicate_strategy: fail
    output_path: Field_2024_final.csv
  generate_depth_profiles: true
columns:
  barcode: Barcode
  genotype: geno
  replicate: Rep
  image_path: image_path
data:
  csv_path: null
  image_dir: null
  output_dir: ./outputs
  additional_exclude_cols:
  - Ent
  - Sub
  - Cid
  - Sid
  - GID
  - Cross name
  - Sel_Hist
  - Origin
  - core_id
  - plant_identifier
  traits_to_include: null
  traits_to_exclude: []
cleanup:
  max_nan_fraction: 0.0
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  min_samples_per_trait: 10
  custom_replacements: null
outlier_detection:
  traditional_methods:
  - mahalanobis
  clustering_methods: []
  pca:
    explained_variance: 0.95
    threshold: 2.5
  isolation_forest:
    contamination: 0.1
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0
  kmeans:
    n_clusters: null
    max_clusters: 10
    distance_threshold: 2.0
  gmm:
    n_components: null
    max_components: 5
    percentile_threshold: 99.0
  hierarchical:
    n_clusters: null
    linkage_method: ward
    distance_threshold: 2.0
outlier_removal:
  strategy: single
  method: mahalanobis
  min_methods: 2
heritability:
  enabled: true
  threshold: 0.5
  generate_diagnostics: true
pca:
  n_components: 0.95
  standardize: true
  feature_selection_strategy: top_variance
  n_top_features: 10
clustering:
  enabled: false
  methods:
  - kmeans
  n_clusters: null
  auto_optimize: true
  min_clusters: 2
  max_clusters: 10
visualization:
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  create_outlier_plots: true
  interactive: false
  dpi: 300
  figsize:
  - 10
  - 8
  title_fontsize: 16
  label_fontsize: 14
  tick_fontsize: 12
  legend_fontsize: 12
  figure_format: png
  bbox_inches: tight
  facecolor: white
  edgecolor: none
  transparent: false
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16
adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0
  adaptive_batch_size: false
  batch_size_threshold: 100
  max_batch_size: 49
logging:
  level: INFO
  log_to_file: true
  log_file: root_core_qc_pipeline.log
