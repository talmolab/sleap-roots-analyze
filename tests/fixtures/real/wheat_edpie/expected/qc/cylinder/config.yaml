pipeline_name: cylinder_edpie_qc
version: '1.0'
enable_parallel: false
root_core: null
columns:
  barcode: plant_qr_code
  genotype: Geno
  replicate: Rep
  image_path: image_path
data:
  csv_path: C:/Users/Elizabeth/Desktop/phenotyping/20251105_wheat_edpie/cylinder/traits_11DAG_cleaned_qc_scanner_independent.csv
  image_dir: null
  output_dir: ./outputs
  additional_exclude_cols: []
  traits_to_include: null
  traits_to_exclude: []
cleanup:
  max_nan_fraction: 0.0
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  min_samples_per_trait: 10
  custom_replacements:
    crown: seminal
outlier_detection:
  traditional_methods:
  - mahalanobis
  clustering_methods: []
  pca:
    explained_variance: 0.95
    threshold: 2.5
  isolation_forest:
    contamination: 0.1
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0
  kmeans:
    n_clusters: null
    max_clusters: 10
    distance_threshold: 2.0
  gmm:
    n_components: null
    max_components: 5
    percentile_threshold: 99.0
  hierarchical:
    n_clusters: null
    linkage_method: ward
    distance_threshold: 2.0
outlier_removal:
  strategy: single
  method: mahalanobis
  min_methods: 2
heritability:
  enabled: true
  threshold: 0.6
  generate_diagnostics: true
pca:
  n_components: 0.95
  standardize: true
  feature_selection_strategy: top_variance
  n_top_features: 10
clustering:
  enabled: false
  methods:
  - kmeans
  n_clusters: null
  auto_optimize: true
  min_clusters: 2
  max_clusters: 10
visualization:
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  create_outlier_plots: true
  interactive: false
  dpi: 100
  figsize:
  - 12
  - 8
  title_fontsize: 16
  label_fontsize: 14
  tick_fontsize: 12
  legend_fontsize: 12
  figure_format: png
  bbox_inches: tight
  facecolor: white
  edgecolor: none
  transparent: false
  enable_batched_plots: false
  batched_plot_threshold: 16
  batch_size: 16
adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0
  adaptive_batch_size: false
  batch_size_threshold: 100
  max_batch_size: 49
logging:
  level: INFO
  log_to_file: true
  log_file: pipeline.log
