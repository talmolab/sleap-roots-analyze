# QC Pipeline Configuration: Root Core (EDPIE Example)
#
# This config processes root biomass and counting data through full QC pipeline,
# merging with above-ground traits BEFORE QC to enable high-dimensional analysis.
#
# Use case: Root core experiments with 3 cores per replicate
# Steps: Core-level QC → Aggregate → Merge → Trait-level QC → Final CSV

# Pipeline metadata
pipeline_name: "edpie_root_core_qc"
version: "1.1"

# ============================================================================
# ROOT CORE PROCESSING (Steps 0a-0f)
# ============================================================================
root_core:
  # Multiple data sources (biomass + counting)
  sources:
    # Source 1: Root biomass dry weight (2 depths)
    - csv_path: "C:/Users/Elizabeth/Desktop/phenotyping/EDPIE_paper/data/root_coring/rearranged_root_biomass_dw.csv"
      data_type: "biomass"  # Manual depth mapping required
      depth_column_prefix: "RootDW"  # Output columns: RootDW_15cm, RootDW_45cm
      value_column_name: "Root_DW_g"
      aggregation_method: "median"  # Aggregates 3 cores → 1 plot value. MEDIAN is robust to outliers (typos, miscounts) without requiring outlier detection
      genotype_column: "salk_geno"  # Map salk_geno -> geno for standardization
      depth_mapping:
        "0-30": 15.0   # Midpoint of 0-30 cm range
        "30-60": 45.0  # Midpoint of 30-60 cm range
      depth_range_mapping:
        15.0: "0-30"   # Display as "Root Biomass DW (g) 0-30cm" instead of "Rootdw 15Cm"
        45.0: "30-60"  # Display as "Root Biomass DW (g) 30-60cm" instead of "Rootdw 45Cm"

    # Source 2: Root intersection counting (12 depths, auto-parsed)
    - csv_path: "C:/Users/Elizabeth/Desktop/phenotyping/EDPIE_paper/data/root_coring/root_counting_cimmyt_edited.csv"
      data_type: "counting"  # Auto-parses from c_<start>_<end>_<subcore> pattern
      depth_column_prefix: "RootCount"  # Output: RootCount_0cm, RootCount_5cm, etc.
      value_column_name: "Root_Count"
      aggregation_method: "median"  # Robust to counting errors and outlier cores
      genotype_column: "geno"  # Already uses standard column name
      # depth_mapping not needed - auto-calculated

  # Core-level QC (before aggregation)
  #
  # This step performs measurement error detection (quality control) at the core level,
  # using per-group analysis to detect gross errors before aggregation.
  #
  # TWO DETECTION METHODS:
  #
  # 1. Missing Data Detection (always enabled if core_qc.enabled=True):
  #    - Flags cores with excessive missing depths (>50% NaN)
  #    - Catches incomplete or damaged samples
  #
  # 2. Value Outlier Detection (opt-in via detect_value_outliers=True):
  #    - Flags cores with anomalous values using percent deviation from median
  #    - Formula: |value - median| / median > threshold (e.g., 0.30 = 30%)
  #    - Per-group analysis (within Plot-Rep-Geno-Depth)
  #    - Conservative 30% default threshold minimizes false positives
  #
  # STATISTICAL FRAMEWORK:
  # - Quality Control paradigm: Not statistical hypothesis testing
  # - Per-group detection: Respects nested structure (cores within plots)
  # - Works with N=3: Non-parametric, no variance estimation required
  # - Independence: Each plot analyzed independently (satisfies i.i.d.)
  #
  # WHY NOT POPULATION-LEVEL METHODS?
  # Population-level outlier detection (Mahalanobis, Isolation Forest on all 180 cores)
  # would violate independence assumptions because cores within plots are NOT independent
  # (share genotype, soil conditions, spatial location). This confounds plot effects with
  # measurement errors and inflates Type I error rates.
  #
  # EXAMPLE (GH_7371 Rep 1):
  # - Cores: [0.76g, 0.71g, 0.31g]
  # - Median: 0.71g
  # - Deviations: [8%, 0%, 56%]
  # - Result: Core 2 flagged (56% > 30%), removed before aggregation
  # - Impact: Heritability improved from 0.27 to >0.50 (biomass traits retained)
  #
  # WHEN TO ENABLE VALUE OUTLIER DETECTION:
  # - Measurement errors expected (typos, damaged cores, sampling failures)
  # - Median aggregation alone not sufficient (N=3 not robust enough)
  # - Need to preserve heritability by removing gross errors
  #
  # THRESHOLD TUNING:
  # - 20%: Aggressive (catches moderate errors, may remove natural variation)
  # - 30%: Conservative (DEFAULT - catches extreme errors, minimal false positives)
  # - 40%: Very conservative (only catches very extreme errors)
  #
  # PUBLICATION-QUALITY METHODS SECTION:
  # "Quality control of core-level data was performed within each plot-depth group
  # (n=3 cores). Cores with biomass values deviating >30% from the within-group
  # median were flagged as potential measurement errors and excluded prior to
  # aggregation. This threshold was chosen conservatively to remove gross errors
  # while preserving natural biological variation (typically <20% within plots)."
  core_qc:
    enabled: true  # Enable core-level QC (missing data detection)
    max_missing_proportion: 0.5  # Flag cores with >50% missing depths
    remove_outliers: true  # Remove flagged cores before aggregation

    # Value outlier detection (opt-in, disabled by default for backward compatibility)
    detect_value_outliers: false  # Set to true to enable measurement error detection
    max_deviation_from_median: 0.30  # 30% threshold (conservative, minimal false positives)
    min_cores_after_qc: 1  # Safety: always keep at least 1 core per group

  # Depth profile visualization (Step 00f)
  generate_depth_profiles: true  # Generate depth profile plots (faceted line + spaghetti)

  # Merge with above-ground traits (BEFORE trait-level QC)
  merge_traits:
    above_ground_csv: "C:/Users/Elizabeth/Desktop/phenotyping/EDPIE_paper/data/field/Field_2024_aboveground.csv"
    join_keys: ["Rep", "geno"]  # CRITICAL: Must match columns in above-ground CSV. Both datasets have 1 row per Rep-Geno (60 total). Plot column preserved from root data.
    join_type: "inner"  # Options: inner (only matching), left (keep all root), right (keep all above-ground), outer (keep all)
    duplicate_strategy: "fail"  # How to handle duplicate trait names: fail (error), skip (keep root version), suffix (add _root/_ag)
    output_path: "Field_2024_final.csv"  # Final merged CSV with root + above-ground traits

# ============================================================================
# TRAIT-LEVEL QC (Standard Pipeline Steps 1-10)
# ============================================================================

# Data configuration (set programmatically from root core processing)
data:
  csv_path: null  # Auto-filled by pipeline
  image_dir: null  # Optional: Link images to samples

  # CRITICAL: Exclude metadata columns from statistical analysis
  # These columns are PRESERVED in the final CSV but NOT used in PCA/outlier/heritability calculations
  additional_exclude_cols:
    - "Ent"          # Entry number
    - "Sub"          # Sub-entry
    - "Cid"          # Cross ID
    - "Sid"          # Selection ID
    - "GID"          # Germplasm ID
    - "Cross name"   # Cross pedigree
    - "Sel_Hist"     # Selection history
    - "Origin"       # Germplasm origin
    - "core_id"      # Core identifier
    - "plant_identifier"  # Plant identifier

# Column names
columns:
  barcode: "Barcode"
  genotype: "geno"
  replicate: "Rep"

# Data cleanup thresholds
# UPDATED to match Nov 30 notebook settings (high heritability config)
cleanup:
  max_zeros_per_trait: 0.5  # Remove depths with >50% zeros (was 0.3)
  max_nans_per_trait: 0.2   # Remove depths with >20% NaNs (was 0.3) - STRICTER
  max_nan_fraction: 0.0     # Remove samples with ANY NaN values (was 0.1) - STRICTER
  min_samples_per_trait: 10

# Outlier detection (replicate-level, after aggregation)
outlier_detection:
  traditional_methods:
    - mahalanobis
    - isolation_forest
  clustering_methods: []

  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

# Outlier removal
outlier_removal:
  strategy: "single"
  method: "mahalanobis"

# PCA configuration
pca:
  n_components: 0.95
  standardize: true
  feature_selection_strategy: "top_variance"
  n_top_features: 10

# Statistical analysis (ANOVA and heritability are always calculated in Step 8)

# Heritability filtering
heritability:
  enabled: true
  threshold: 0.5
  generate_diagnostics: true  # Generate detailed diagnostic plots and CSV for removed traits

# Visualization
visualization:
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  create_outlier_plots: true
  interactive: false
  dpi: 500  # Publication-quality DPI
  figsize: [10, 8]

  # Font sizes (explicit configuration)
  title_fontsize: 16
  label_fontsize: 14
  tick_fontsize: 12
  legend_fontsize: 12

  # Figure format
  figure_format: "png"

  # Savefig parameters - ensures white background
  bbox_inches: "tight"
  facecolor: "white"
  edgecolor: "none"
  transparent: false

  # Batched plot configuration
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

# Adaptive figure sizing
adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

# Summary report (always generated in Step 10)

# Logging
logging:
  level: "INFO"
  log_to_file: true
  log_file: "root_core_qc_pipeline.log"