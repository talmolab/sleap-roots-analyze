# Golden Template: QC Pipeline Configuration (Grouped Analysis)
#
# This template is for multi-group experiments (e.g., multiple timepoints, batches, sites).
# Each group is analyzed independently, preventing confounding of group and genetic effects.
#
# REQUIRED CUSTOMIZATIONS (replace FILL_IN_* placeholders):
#   - data.csv_path
#   - data.group_by (column name to group by, e.g., "plant_age_days")
#   - columns.barcode, columns.genotype
#   - pipeline_name
#
# OPTIONAL CUSTOMIZATIONS:
#   - columns.replicate (omit, or set null, for data with no replicate factor)
#   - cleanup thresholds (max_nan_fraction, max_zeros_per_trait, etc.)
#   - heritability.threshold (default: 0.30 = permissive)
#   - outlier_detection settings (default: Mahalanobis chi-squared at 99th percentile)
#
# This template includes ALL required schema fields. Do not remove sections.

pipeline_name: "FILL_IN_PIPELINE_NAME"  # E.g., "my_analysis_qc_grouped"
version: "1.0"
enable_parallel: false

data:
  # Path to your trait CSV file (must exist before running)
  csv_path: "FILL_IN_CSV_PATH"  # E.g., "/path/to/traits_summary.csv"

  # Image directory (optional; set to null if no images)
  image_dir: null

  # Additional columns to exclude from analysis (besides standard metadata columns)
  additional_exclude_cols: []

  # Optional input-contract validation at the data-load boundary (issue #144).
  # Requires the optional `sleap-roots-contracts` dependency; a logged no-op if it
  # isn't installed. See the DataConfig.validate_input docstring for details.
  #   off    = skip validation
  #   warn   = log issues; hard-fail only on structural errors (default)
  #   strict = raise on any contract violation (use at untrusted/external boundaries)
  validate_input: warn

  # CRITICAL: Column to group by. Each unique value becomes an independent analysis.
  # Common use: "plant_age_days" for timepoints, "site" for multi-location experiments.
  # Each group must have ≥ min_samples_per_trait samples or it will be skipped.
  group_by: "FILL_IN_GROUP_BY_COLUMN"  # E.g., "plant_age_days"

columns:
  # Column containing unique sample identifiers (plant QR code, barcode, sample ID)
  barcode: "FILL_IN_BARCODE_COLUMN"  # E.g., "plant_qr_code"

  # Column containing genotype/accession/variety identifiers
  genotype: "FILL_IN_GENOTYPE_COLUMN"  # E.g., "accession_id"

  # OPTIONAL: replicate/plant ID column (within each genotype). Disabled by
  # default — omit this line (or set `replicate: null`) for data with no
  # replicate factor, e.g. cylinder data. Uncomment only if your data has one.
  # replicate: "FILL_IN_REPLICATE_COLUMN"  # E.g., "plant_id"

cleanup:
  # Drop trait columns with >50% zero values (helps remove near-constant traits)
  # Range: 0.0 (strict) to 1.0 (permissive). Typical: 0.4–0.6.
  max_zeros_per_trait: 0.5

  # Drop trait columns with >20% NaN values (removes sparse traits)
  # Range: 0.0 (strict) to 1.0 (permissive). Typical: 0.1–0.3.
  max_nans_per_trait: 0.2

  # Drop samples with >0% NaN values (strict: any NaN drops the sample)
  # Range: 0.0 (strict) to 1.0 (permissive). 0.0 = no missing data allowed.
  # For grouped analysis, applied per group (not across groups).
  max_nan_fraction: 0.0

  # Minimum non-NaN values required per trait column within each group.
  # Also controls minimum group size: groups with < min_samples_per_trait samples are skipped.
  # Typical: 10–30 depending on group size. For ~40 samples/group, use 10–15.
  min_samples_per_trait: 10

  # Optional: drop constant (zero-variance) traits — a trait whose values are all
  # identical carries no information for PCA/heritability. Default 0.0 drops
  # exactly-constant traits (recommended); set negative to disable. This is raw
  # (pre-standardization) variance, so keep 0.0 unless you have a reason to raise it.
  # min_variance: 0.0

outlier_detection:
  # Traditional outlier detection methods: pca, isolation_forest, mahalanobis
  # For grouped analysis with n ≥ 30 per group, Mahalanobis chi-squared is recommended.
  # For small groups (n < 30), consider lowering chi2_percentile or using isolation_forest.
  traditional_methods:
    - mahalanobis

  # Clustering-based outlier methods: kmeans, gmm, hierarchical
  # Generally not needed if Mahalanobis is used.
  clustering_methods: []

  # Mahalanobis distance settings (only if mahalanobis in traditional_methods)
  mahalanobis:
    # PCA variance threshold for dimensionality reduction before Mahalanobis
    variance_threshold: 0.95

    # Use chi-squared approximation for outlier flagging (requires n ≥ 30)
    use_chi_squared: true

    # Percentile threshold for chi-squared outlier detection
    # 99.0 = strict (only top 1% flagged), 95.0 = permissive (top 5% flagged)
    # For small groups (n < 30), use 95.0 or disable chi-squared.
    chi2_percentile: 99.0

outlier_removal:
  # Strategy for removing outliers: "single", "consensus", "subset"
  # "single" = use one method (specify which in 'method' below)
  # "consensus" = sample must be flagged by all methods
  # "subset" = sample must be flagged by at least min_methods methods
  strategy: "single"

  # Which method to use for outlier removal (must be in traditional_methods or clustering_methods)
  method: "mahalanobis"

heritability:
  # Enable heritability filtering (drop traits with H² below threshold)
  # Requires ≥ 3 replicates per genotype in each group for reliable estimates.
  enabled: true

  # Minimum heritability threshold (H² ≥ threshold to retain trait)
  # 0.30 = permissive (exploratory), 0.40 = moderate, 0.50–0.60 = strict (only highly heritable traits)
  threshold: 0.30

  # Generate diagnostic plots for heritability estimates
  generate_diagnostics: true

visualization:
  # DPI for saved figures (300 = publication quality)
  dpi: 300

  # Default figure size [width, height] in inches
  figsize: [12, 8]

  # Output format: "png", "pdf", "svg"
  figure_format: "png"

  # Enable batched plots for large trait sets (splits plots into batches)
  enable_batched_plots: true

  # Number of traits per batch (when batched plots enabled)
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  # Enable adaptive figure sizing based on number of items (genotypes, traits, etc.)
  enabled: true

  # Base size and scaling factors
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0

  # Bounds on adaptive sizing
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Write logs to a file
  log_to_file: true
  log_file: "pipeline.log"
