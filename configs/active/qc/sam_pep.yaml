# QC Pipeline Configuration: SAM_PEP (Maurizio Chiurazzi)
#
# Dataset: Z:/users/eberrigan/20260818_Maurizio_Chiurazzi_SAM_PEP/sleap_roots_traits_output/traits_summary_with_genotype_no_root_widths.csv
# Analysis date: 2026-08-20
# Generated from: qc_template_grouped.yaml
#
# Key choices:
#   group_by: plant_age_days — repeated-measures design (9 plants x 3 ages);
#     grouping avoids age confounding the dose-response comparison (2026-08-20 decision).
#   cleanup.min_samples_per_trait: 7 — group size is only 9 (2-4 plants per dose per age);
#     the template default of 10 would exceed every group's size and skip all 3 age-groups
#     entirely. 7 is ~75% of 9, allowing up to 2 missing values per trait.
#   outlier_detection: disabled — Mahalanobis needs n>=30; groups here have n=9
#     (2026-08-20 decision, per pipeline's own small-n guardrail).
#   heritability.threshold: 0.0 — exploratory (compute H2 for diagnostics, no filtering).
#     1uM dose group has only 2 replicates (< the recommended 3), so H2 estimates will be
#     noisy; this is diagnostic-only per lab convention for first-pass runs.
#   columns.replicate: scan_id — distinct from barcode (plant_qr_code) per known issue #96
#     (same-column crash); each plant has exactly one scan per age-group, so this is a
#     per-scan identifier rather than a true technical-replicate factor.

pipeline_name: "sam_pep_qc"
version: "1.0"
enable_parallel: false

data:
  # Path to your trait CSV file (must exist before running)
  csv_path: "Z:/users/eberrigan/20260818_Maurizio_Chiurazzi_SAM_PEP/sleap_roots_traits_output/traits_summary_with_genotype_no_root_widths.csv"

  # Image directory (optional; set to null if no images)
  image_dir: null

  # Additional columns to exclude from analysis (besides standard metadata columns)
  additional_exclude_cols: []

  # Optional input-contract validation at the data-load boundary (issue #144).
  # Requires the optional `sleap-roots-contracts` dependency; a logged no-op if it
  # isn't installed. See the DataConfig.validate_input docstring for details.
  #   off    = skip validation
  #   warn   = log issues; hard-fail only on structural errors (default)
  #   strict = raise on any contract violation (use at untrusted/external boundaries)
  validate_input: warn

  # CRITICAL: Column to group by. Each unique value becomes an independent analysis.
  # Repeated-measures dose x age design: grouping by age avoids age confounding dose.
  group_by: "plant_age_days"

columns:
  # Column containing unique sample identifiers (plant QR code, barcode, sample ID)
  barcode: "plant_qr_code"

  # Column containing genotype/accession/variety identifiers
  genotype: "genotype"

  # Distinct from barcode (issue #96); per-scan identifier since there's one scan per
  # plant per age-group (no true technical-replicate factor in this design).
  replicate: "scan_id"

cleanup:
  # Drop trait columns with >50% zero values (helps remove near-constant traits)
  max_zeros_per_trait: 0.5

  # Drop trait columns with >20% NaN values (removes sparse traits)
  max_nans_per_trait: 0.2

  # Drop samples with >0% NaN values (strict: any NaN drops the sample)
  max_nan_fraction: 0.0

  # CUSTOM: group size is only 9 (2-4 plants per dose x per age-group). Template default
  # of 10 would exceed every group's size and skip all 3 age-groups. 7 = ~75% of 9.
  min_samples_per_trait: 7

outlier_detection:
  # CUSTOM: disabled. Mahalanobis requires n>=30; these groups have n=9 (2026-08-20 decision).
  traditional_methods: []

  clustering_methods: []

  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

outlier_removal:
  strategy: "single"
  method: "mahalanobis"

heritability:
  # Enabled for diagnostics; not used to filter traits (threshold 0.0).
  enabled: true

  # CUSTOM: 0.0 (exploratory) — 1uM dose group has only 2 replicates (< recommended 3),
  # so H2 estimates are noisy; compute for visualization/diagnostics only, no filtering.
  threshold: 0.0

  generate_diagnostics: true

visualization:
  dpi: 300
  figsize: [12, 8]
  figure_format: "png"
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"
