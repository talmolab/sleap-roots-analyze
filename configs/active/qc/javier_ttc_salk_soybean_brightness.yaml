# QC Pipeline Configuration: Javier TTC-SALK Soybean — BRIGHTNESS RETRAIN (2026-05-04)
#
# Dataset: Z:/users/eberrigan/20260401_Javier_Martinez_Pacheco_TTC_SALK_Soybean/2026-05-08_aug_retrain/brightness/traits_output/traits_summary_with_genotype.csv
# Analysis date: 2026-05-04
# Adapted from: qc/javier_ttc_salk_soybean.yaml (the Apr-8 deployed_2022 baseline run)
#
# What's different vs Apr-8 baseline:
#   - csv_path -> brightness-aug retrain output (not deployed_2022)
#   - 452 scans at Day-10 only vs 1543 across Day-8 + Day-10
#   - group_by still plant_age_days but only one value (10) so one group
# Everything else (cleanup, heritability, outlier detection, PCA settings)
# matches the Apr-8 baseline for fair comparison.

pipeline_name: "javier_ttc_salk_soybean_brightness"
version: "1.0"
enable_parallel: false

data:
  csv_path: "Z:/users/eberrigan/20260401_Javier_Martinez_Pacheco_TTC_SALK_Soybean/2026-05-08_aug_retrain/brightness/traits_output/traits_summary_with_genotype.csv"
  image_dir: null
  additional_exclude_cols: []
  group_by: "plant_age_days"

columns:
  barcode: "plant_qr_code"
  genotype: "genotype"
  replicate: "scan_id"

cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 30

outlier_detection:
  traditional_methods:
    - mahalanobis
  clustering_methods: []
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

outlier_removal:
  strategy: "single"
  method: "mahalanobis"

heritability:
  enabled: true
  threshold: 0.0
  generate_diagnostics: true

visualization:
  dpi: 150
  figsize: [12, 8]
  figure_format: "png"
  enable_batched_plots: false
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"
