# QC Pipeline Configuration: FN2021_3day
#
# Dataset: Z:/users/eberrigan/20260817_Sanghwa_Lee_FN2021/3_day_old/sleap_roots_traits_output/traits_summary_with_genotype_no_root_widths.csv
# Analysis date: 2026-08-18
# Generated from: qc_template_ungrouped.yaml
#
# Key choices:
#   51 genotypes, 28-32 replicates each (Kitaake/Kit-X/Nipponbare controls + FN mutant
#   lines + OsPSY1.x lines) — balanced multi-genotype panel, well above the >=3 replicate
#   minimum for heritability.
#   heritability.threshold: 0.0 — exploratory first pass (lab convention), same as FN900S/FN858S
#   cleanup.min_samples_per_trait: 391 — max(10, n_samples=1567 // 4)
#   outlier_detection.mahalanobis.chi2_percentile: 99.0 (default) — n=1567 (ungrouped, whole
#     dataset) is well above the n>=30 stability threshold for Mahalanobis, no adjustment needed
#   group_by: null — single site/timepoint dataset; genotype is used for heritability/coloring
#     only, not as a subdivision axis

pipeline_name: "FN2021_3day"
version: "1.0"
enable_parallel: false

data:
  # Path to your trait CSV file (must exist before running)
  csv_path: "Z:/users/eberrigan/20260817_Sanghwa_Lee_FN2021/3_day_old/sleap_roots_traits_output/traits_summary_with_genotype_no_root_widths.csv"

  # Image directory (optional; set to null if no images)
  image_dir: "Z:/users/eberrigan/20260817_Sanghwa_Lee_FN2021/3_day_old/images_downloader_output"

  # Additional columns to exclude from analysis (besides standard metadata columns)
  additional_exclude_cols: []

  # Optional input-contract validation at the data-load boundary (issue #144).
  validate_input: warn

  # Group-by column for multi-group analysis (set to null for ungrouped analysis)
  group_by: null

columns:
  # Column containing unique sample identifiers (plant QR code, barcode, sample ID)
  barcode: "plant_qr_code"

  # Column containing genotype/accession/variety identifiers
  genotype: "genotype"

  # OPTIONAL: replicate/plant ID column (within each genotype). scan_id used as a
  # harmless placeholder distinct from barcode — H^2 counts replicates by distinct
  # barcode per genotype, so the literal value here doesn't affect the estimate.
  replicate: "scan_id"

cleanup:
  # Drop trait columns with >50% zero values (helps remove near-constant traits)
  max_zeros_per_trait: 0.5

  # Drop trait columns with >20% NaN values (removes sparse traits)
  max_nans_per_trait: 0.2

  # Drop samples with >0% NaN values (strict: any NaN drops the sample)
  max_nan_fraction: 0.0

  # Minimum non-NaN values required per trait column
  # max(10, 1567 // 4)
  min_samples_per_trait: 391

outlier_detection:
  # Traditional outlier detection methods: pca, isolation_forest, mahalanobis
  traditional_methods:
    - mahalanobis

  # Clustering-based outlier methods: kmeans, gmm, hierarchical
  clustering_methods: []

  # Mahalanobis distance settings (only if mahalanobis in traditional_methods)
  mahalanobis:
    # PCA variance threshold for dimensionality reduction before Mahalanobis
    variance_threshold: 0.95

    # Use chi-squared approximation for outlier flagging (requires n >= 30)
    use_chi_squared: true

    # Percentile threshold for chi-squared outlier detection
    # n=1567 (ungrouped, whole dataset) — well above n>=30, default is appropriate
    chi2_percentile: 99.0

outlier_removal:
  # Strategy for removing outliers: "single", "consensus", "subset"
  strategy: "single"

  # Which method to use for outlier removal (must be in traditional_methods or clustering_methods)
  method: "mahalanobis"

heritability:
  # 51 genotypes, 28-32 replicates each — well above the >=3 minimum.
  enabled: true

  # Minimum heritability threshold (H^2 >= threshold to retain trait)
  # 0.0 = exploratory first pass, calculate/visualize H^2 without filtering
  threshold: 0.0

  # Generate diagnostic plots for heritability estimates
  generate_diagnostics: true

visualization:
  # DPI for saved figures (300 = publication quality, 100 = faster for exploratory)
  dpi: 100

  # Default figure size [width, height] in inches
  figsize: [12, 8]

  # Output format: "png", "pdf", "svg"
  figure_format: "png"

  # Enable batched plots for large trait sets (splits plots into batches)
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  # Enable adaptive figure sizing based on number of items (genotypes, traits, etc.)
  enabled: true

  # Base size and scaling factors
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0

  # Bounds on adaptive sizing
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Write logs to a file
  log_to_file: true
  log_file: "pipeline.log"
