# QC Pipeline Configuration: Javier TTC-SALK Soybean — Round-3 Full Experiment 9-Wave (PER-WAVE GROUPED)
#
# Dataset: Z:/users/eberrigan/20260401_Javier_Martinez_Pacheco_TTC_SALK_Soybean/2026-05-08_aug_retrain/brightness/traits_output_9wave/traits_summary_with_genotype.csv
# Analysis date: 2026-05-26
# Generated from: qc_template_grouped.yaml via /configure-run-all
#
# Key choices:
#   group_by: wave_number — fans out QC into 9 independent sub-runs (one per wave). Eliminates cross-wave batch effects within each sub-run.
#   heritability.threshold: 0.0 — visualize H² across all traits per wave; do NOT filter
#   cleanup.min_samples_per_trait: 10 — per slash-command rule max(10, n_smallest_group//4) = max(10, 37//4=9) = 10
#                                       (wave 8 is smallest at n=37; smaller threshold than whole-dataset config to keep more traits per wave)
#   outlier_detection.mahalanobis.chi2_percentile: 99.0 — strict; all wave-level groups n≥37 so chi-squared reliable
#   pca.n_components: 0.75, feature_selection_strategy: "extreme" — round-2 values
#
# Companion to: qc/javier_ttc_salk_soybean_full_experiment_9wave.yaml (whole-dataset ungrouped run, Phase 3a)

pipeline_name: "javier_ttc_salk_soybean_full_experiment_9wave_per_wave"
version: "1.0"
enable_parallel: false

data:
  csv_path: "Z:/users/eberrigan/20260401_Javier_Martinez_Pacheco_TTC_SALK_Soybean/2026-05-08_aug_retrain/brightness/traits_output_9wave/traits_summary_with_genotype.csv"
  image_dir: null
  additional_exclude_cols: []
  group_by: "wave_number"

columns:
  barcode: "plant_qr_code"
  genotype: "genotype"
  replicate: "scan_id"

cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 10

outlier_detection:
  traditional_methods:
    - mahalanobis
  clustering_methods: []
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

outlier_removal:
  strategy: "single"
  method: "mahalanobis"

heritability:
  enabled: true
  threshold: 0.0
  generate_diagnostics: true

visualization:
  dpi: 100
  figsize: [12, 8]
  figure_format: "png"
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"
