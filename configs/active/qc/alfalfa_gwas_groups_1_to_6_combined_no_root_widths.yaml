# QC Pipeline Configuration: alfalfa_gwas_groups_1_to_6_combined_no_root_widths
#
# Same as alfalfa_gwas_groups_1_to_6_combined.yaml but with all 81 root_widths_*
# columns explicitly excluded via additional_exclude_cols. Root Widths is known
# unreliable for non-soybean crops (lateral-root proximity threshold tuned for
# soybean morphology). Excluding up-front rather than relying on per-trait NaN
# filter (which doesn't catch ~5% NaN rate) — see notable_results.md.
#
# Date: 2026-04-26 (follow-up run after initial analysis)

