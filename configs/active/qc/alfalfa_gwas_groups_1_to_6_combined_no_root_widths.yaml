# QC Pipeline Configuration: alfalfa_gwas_groups_1_to_6_combined_no_root_widths
#
# Same as alfalfa_gwas_groups_1_to_6_combined.yaml but reads from a pre-filtered
# input CSV with the 81 root_widths_* columns ALREADY DROPPED (combined_traits_
# summary_no_root_widths.csv, generated by combined_analysis/build_combined_traits.py
# + a one-shot drop step). Root Widths is unreliable for non-soybean crops.
#
# NOTE: we pre-filter rather than use additional_exclude_cols because the latter
# triggers a viz pipeline bug at steps 09/10 ("Length of values does not match length
# of index"). Filed as talmolab/sleap-roots-analyze#113.
#
# Date: 2026-04-26 (follow-up run after initial analysis)

pipeline_name: alfalfa_gwas_groups_1_to_6_combined_no_root_widths_qc
version: '1.0'
enable_parallel: false
data:
  csv_path: Z:/users/eberrigan/20260425_Mauricio_Chiurazzi_Alfalfa_GWAS_groups_1-6_canola_models/combined_analysis/combined_traits_summary_no_root_widths.csv
  image_dir: null
  additional_exclude_cols: []
  group_by: plant_age_days
columns:
  barcode: scan_id
  genotype: accession_name
  replicate: plant_id
cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 30
outlier_detection:
  traditional_methods:
  - mahalanobis
  clustering_methods: []
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0
outlier_removal:
  strategy: single
  method: mahalanobis
heritability:
  enabled: true
  threshold: 0.0
  generate_diagnostics: true
visualization:
  dpi: 300
  figsize:
  - 12
  - 8
  figure_format: png
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16
adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0
logging:
  level: INFO
  log_to_file: true
  log_file: pipeline.log
