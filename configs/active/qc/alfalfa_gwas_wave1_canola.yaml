# QC Pipeline Configuration: Alfalfa GWAS Wave 1 (Canola Models)
#
# Dataset: Mauricio Chiurazzi Alfalfa GWAS wave 1 reprocessed with canola (dicot) models
# Plant age days present: [0, 3, 5, 7, 9, 12]
#
# Grouped analysis: each timepoint (plant_age_days value) is analyzed independently.
# Heritability filtering DISABLED per user request (calculated in viz instead).

pipeline_name: "alfalfa_gwas_wave1_canola_qc"
version: "1.0"
enable_parallel: false

data:
  csv_path: "Z:/users/eberrigan/20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models/sleap_roots_traits_output/traits_summary.csv"
  image_dir: null
  additional_exclude_cols: []
  group_by: "plant_age_days"

columns:
  barcode: "plant_qr_code"
  genotype: "accession_id"
  replicate: "plant_id"

cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 10

outlier_detection:
  traditional_methods:
    - mahalanobis
  clustering_methods: []
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

outlier_removal:
  strategy: "single"
  method: "mahalanobis"

pca:
  n_components: 0.75
  feature_selection_strategy: "extreme"

heritability:
  enabled: false
  threshold: 0.30
  generate_diagnostics: true

visualization:
  dpi: 300
  figsize: [12, 8]
  figure_format: "png"
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"
