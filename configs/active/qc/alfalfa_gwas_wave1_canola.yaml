# QC Pipeline Configuration: Alfalfa GWAS Wave 1 (Canola Models)
#
# Dataset: Z:/users/eberrigan/20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models/sleap_roots_traits_output/traits_summary.csv
# Analysis date: 2026-02-19
# Generated by: /configure-run-all
#
# Key choices:
#   heritability.enabled: false — user requested no heritability filtering
#   group_by: plant_age_days — timecourse analysis (6 timepoints)
#   chi2_percentile: 99.0 — conservative outlier detection (n >= 42 per group)

pipeline_name: "alfalfa_gwas_wave1_canola_qc"
version: "1.0"

data:
  csv_path: "Z:/users/eberrigan/20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models/sleap_roots_traits_output/traits_summary.csv"
  group_by: "plant_age_days"

columns:
  barcode: "plant_qr_code"
  genotype: "accession_id"
  replicate: "plant_id"

cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 10

outlier_detection:
  traditional_methods:
    - mahalanobis
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

heritability:
  enabled: false

output:
  directory: "Z:/users/eberrigan/20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models/sleap-roots-analyze-output"
