# QC Pipeline Configuration: Mauricio Alfalfa GWAS Groups 1-6 Combined (day 9 + 12)
#
# Dataset: combined_traits_summary.csv (1,022 rows from 6 alfalfa Bloom experiments)
# Analysis date: 2026-04-26
# Generated from: qc_template_grouped.yaml
#
# Key choices:
#   group_by: plant_age_days — analyze day 9 and day 12 as separate groups
#   heritability.enabled: true, threshold: 0.0 — FIRST-PASS: compute H² for visualization
#     without filtering. This dataset is expected to be heterogeneous (35 alfalfa accessions
#     across 6 Bloom experiments). After examining the H² distribution from this run, a
#     follow-up run will use a data-driven threshold (likely 0.30-0.50) to filter traits.
#   pca.feature_selection_strategy: extreme — pairs of mechanistic opposites per PC

pipeline_name: "alfalfa_gwas_groups_1_to_6_combined_qc"
version: "1.0"
enable_parallel: false

data:
  csv_path: "Z:/users/eberrigan/20260425_Mauricio_Chiurazzi_Alfalfa_GWAS_groups_1-6_canola_models/combined_analysis/combined_traits_summary.csv"
  image_dir: null
  additional_exclude_cols: []
  group_by: "plant_age_days"

columns:
  barcode: "scan_id"
  genotype: "accession_name"
  replicate: "plant_id"

cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 30

outlier_detection:
  traditional_methods:
    - mahalanobis
  clustering_methods: []
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

outlier_removal:
  strategy: "single"
  method: "mahalanobis"

heritability:
  enabled: true
  threshold: 0.0   # Visualization-only (no filtering - all traits retained)
  generate_diagnostics: true

visualization:
  dpi: 300
  figsize: [12, 8]
  figure_format: "png"
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"
