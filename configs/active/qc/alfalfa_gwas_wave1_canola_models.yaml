# QC Pipeline Configuration: Alfalfa GWAS Wave 1 (Canola Models)
#
# Dataset: Z:\users\eberrigan\20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models\sleap_roots_traits_output\traits_summary.csv
# Analysis date: 2026-02-20
# Generated from: qc_template_grouped.yaml (via /configure-run-all)
#
# Key choices:
#   group_by: plant_age_days (6 timepoints: 0, 3, 5, 7, 9, 12 days; n=42-72 per group)
#   heritability: enabled for visualization, threshold=0.0 (no filtering)
#   pca.n_components: 0.75 (retain PCs explaining 75% variance - custom)
#   pca.feature_selection_strategy: extreme (mechanistic interpretation - custom)
#   outlier_detection: Mahalanobis chi-squared at 99th percentile
#   max_nan_fraction: 0.0 (strict - no NaNs allowed in samples)

pipeline_name: "alfalfa_gwas_wave1_canola_models_qc"
version: "1.0"
enable_parallel: false

data:
  csv_path: "Z:\\users\\eberrigan\\20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models\\sleap_roots_traits_output\\traits_summary.csv"
  image_dir: null
  additional_exclude_cols: []
  group_by: "plant_age_days"

columns:
  barcode: "plant_qr_code"
  genotype: "accession_id"
  replicate: "plant_id"

cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.2
  max_nan_fraction: 0.0
  min_samples_per_trait: 10

outlier_detection:
  traditional_methods:
    - mahalanobis
  clustering_methods: []
  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

outlier_removal:
  strategy: "single"
  method: "mahalanobis"

heritability:
  enabled: true
  threshold: 0.0  # Visualization-only (no filtering - all traits retained)
  generate_diagnostics: true

visualization:
  dpi: 300
  figsize: [12, 8]
  figure_format: "png"
  enable_batched_plots: true
  batched_plot_threshold: 16
  batch_size: 16

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"
