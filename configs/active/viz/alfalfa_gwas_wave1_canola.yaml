# Visualization Pipeline Configuration: Alfalfa GWAS Wave 1 (Canola Models)
#
# Dataset: QC output from qc/alfalfa_gwas_wave1_canola.yaml
# Analysis date: 2026-02-19
# Generated by: /configure-run-all
#
# Note: When run via run-all, csv_path is auto-updated to the QC output.
#
# Key choices:
#   feature_selection_strategy: extreme — traits with most extreme positive AND negative PC loadings
#   pca_biplot_top_features: 1 — 2 arrows per PC (1 positive, 1 negative)
#   n_components: 0.75 — keep PCs explaining 75% of variance

pipeline_name: "alfalfa_gwas_wave1_canola_viz"
version: "1.0"

data:
  csv_path: null  # Auto-updated by run-all to point to QC output
  image_dir: null

columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: "Replicate"
  image_path: null

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

pca:
  n_components: 0.75
  standardize: true
  feature_selection_strategy: "extreme"
  n_top_features: 5
  pca_biplot_top_features: 1

umap:
  enabled: true
  n_neighbors: 15
  min_dist: 0.1
  random_state: 42

clustering:
  enabled: false

heritability:
  enabled: true
  threshold: 0.30
  generate_diagnostics: true

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30
  max_genotypes: 10
  generate_image_grids: false

static_viz:
  enabled: true
  formats: [png, pdf]
  dpi: 300
  create_pca_plots: true
  create_umap_plots: true
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true

interactive_viz:
  enabled: true
  create_pca_plots: true
  show_images_on_hover: false

summary:
  enabled: true
  formats: [markdown, json]

output:
  directory: "Z:/users/eberrigan/20260218_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_canola_models/sleap-roots-analyze-output"
