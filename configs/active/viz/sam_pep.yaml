# Visualization Pipeline Configuration: SAM_PEP (Maurizio Chiurazzi)
#
# Dataset: QC output from qc/sam_pep.yaml
# Analysis date: 2026-08-20
# Generated from: viz_template_with_images.yaml
#
# Note: csv_path will be auto-updated to QC output when run via run-all.
#
# Key choices:
#   image_linking_method: cylinder — Bloom cylinder scans store images at
#     images_downloader_output/images/Wave<N>/Day<D>_<date>/<qr>/<1-72>.jpg; the
#     "cylinder" linker resolves this via the scan_path column instead of the
#     default rhizovision barcode-filename convention (which would find nothing).
#   image_dir points at images_downloader_output/ (NOT .../images/) — the cylinder
#     linker strips the "./images_downloader_output/" prefix from scan_path itself.
#   pca.n_components: 0.75, feature_selection_strategy: extreme — 966 numeric traits
#     vs n=9 per age-group; aggressive dimensionality reduction to reduce noise.
#   umap.enabled: false — n=9 per age-group is well below the n>=15 recommendation
#     (recommend_umap_n_neighbors(9) -> n_neighbors=2, flagged unreliable); consistent
#     with the outlier-detection small-n decision made for the QC config (2026-08-20).

pipeline_name: "sam_pep_viz"
version: "1.0"

data:
  # Auto-updated by run-all to point to QC output (10_final_data.csv per group)
  csv_path: "FILL_IN_CSV_PATH"

  # Path to images_downloader_output/ (parent of images/) — see note above
  image_dir: "Z:/users/eberrigan/20260818_Maurizio_Chiurazzi_SAM_PEP/images_downloader_output"

  # Bloom cylinder scan layout, resolved via scan_path (default rhizovision naming
  # convention would not match this folder structure)
  image_linking_method: "cylinder"
  scan_path_col: "scan_path"

# Column names after QC pipeline sanitization
columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: "Replicate"
  image_path: null

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

# PCA configuration
pca:
  # CUSTOM: 0.75 (default 0.95) — 966 numeric traits vs n=9 per group; more
  # aggressive reduction to avoid overfitting noise components.
  n_components: 0.75

  standardize: true

  # CUSTOM: "extreme" (default "top_variance") — surfaces traits at both ends of
  # each retained PC's loading, useful for mechanistic interpretation with few traits shown.
  feature_selection_strategy: "extreme"

umap:
  # CUSTOM: disabled (default true) — n=9 per age-group is below the n>=15
  # recommendation; recommend_umap_n_neighbors(9) flags n_neighbors=2 as unreliable.
  enabled: false

  n_neighbors: 10
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

clustering:
  enabled: false

# Heritability filtering (already done in QC; disabled here)
heritability:
  enabled: false
  threshold: 0.30

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30
  max_genotypes: 6
  generate_image_grids: true
  images_per_genotype: 9

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true
  pca_biplot_top_features: 1

interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  show_images_on_hover: true

dashboard:
  enabled: false

summary:
  enabled: true
  formats:
    - markdown
    - json

logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"
