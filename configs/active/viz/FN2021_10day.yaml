# Visualization Pipeline Configuration: FN2021_10day
#
# Dataset: QC output from qc/FN2021_10day.yaml
# Analysis date: 2026-08-18
# Generated from: viz_template_with_images.yaml
#
# Note: csv_path will be auto-updated to QC output when run via run-all.
#
# Key choices:
#   pca.n_components: 0.75 — tighter than default 0.95 given 913 traits vs 1567 samples
#   umap.n_neighbors: 15 — computed recommendation for n=1567

pipeline_name: "FN2021_10day"
version: "1.0"

data:
  csv_path: "FILL_IN_BY_RUN_ALL"
  image_dir: "Z:/users/eberrigan/20260817_Sanghwa_Lee_FN2021/10_day_old/images_downloader_output"

columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: "Replicate"
  image_path: null

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

pca:
  n_components: 0.75
  standardize: true
  feature_selection_strategy: "extreme"

umap:
  enabled: true
  n_neighbors: 15
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

clustering:
  enabled: false

heritability:
  enabled: false
  threshold: 0.30

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30
  max_genotypes: 6
  generate_image_grids: true
  images_per_genotype: 9

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true

  # For "extreme" strategy: 1 = 2 arrows per PC. With 913 traits, keep at 1 to avoid crowding.
  pca_biplot_top_features: 1

interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  show_images_on_hover: true

dashboard:
  enabled: false

summary:
  enabled: true
  formats:
    - markdown
    - json

logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"
