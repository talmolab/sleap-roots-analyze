# Visualization Pipeline Configuration: Mauricio Alfalfa GWAS Groups 1-6 Combined
#
# Dataset: QC output from qc/alfalfa_gwas_groups_1_to_6_combined.yaml
# Analysis date: 2026-04-26
# Generated from: viz_template_no_images.yaml
#
# Note: csv_path is auto-updated by run-all to point to QC's 10_final_data.csv per group.

pipeline_name: "alfalfa_gwas_groups_1_to_6_combined_viz"
version: "1.0"

data:
  csv_path: "WILL_BE_AUTO_UPDATED_BY_RUN_ALL"
  image_dir: null

columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: "Replicate"
  image_path: null

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

pca:
  n_components: 0.75
  standardize: true
  feature_selection_strategy: "extreme"
  n_top_features: 5

umap:
  enabled: true
  n_neighbors: 15
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

clustering:
  enabled: false

heritability:
  enabled: true
  threshold: 0.0   # Visualization-only (no filtering)

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30
  max_genotypes: 6
  generate_image_grids: false
  images_per_genotype: 9

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true
  pca_biplot_top_features: 1

interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  show_images_on_hover: false

dashboard:
  enabled: false

summary:
  enabled: true
  formats:
    - markdown
    - json

logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"
