# Visualization Pipeline Configuration: Alfalfa GWAS Wave 1 (Canola Models)
#
# Dataset: QC output from qc/alfalfa_gwas_wave1_canola_models.yaml
# Analysis date: 2026-02-20
# Generated from: viz_template_with_images.yaml (via /configure-run-all)
#
# Key choices:
#   pca.n_components: 0.75 (retain PCs explaining 75% variance - matches QC config)
#   pca.feature_selection_strategy: extreme (mechanistic interpretation)
#   static_viz.pca_biplot_top_features: 1 (2 arrows per PC for extreme strategy)
#   umap: enabled with n_neighbors=10 (default for dataset size)
#   images: enabled for hover display and image grids
#
# Note: csv_path will be auto-updated to QC output when run via run-all.

pipeline_name: "alfalfa_gwas_wave1_canola_models_viz"
version: "1.0"

data:
  # Path to QC output CSV (auto-updated by run-all to point to 10_final_data.csv)
  csv_path: "PLACEHOLDER_WILL_BE_AUTO_UPDATED_BY_RUN_ALL"

  # Path to directory containing images
  # Images are matched to samples by barcode (filename should contain barcode)
  image_dir: "Z:\\users\\eberrigan\\20251213_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_Dec2025\\images_downloader_output\\images"

# Column names after QC pipeline sanitization
# QC pipeline renames columns to: Barcode, Genotype, Replicate
columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: "Replicate"
  image_path: null  # No pre-computed image paths; matched from image_dir by barcode

statistics:
  # Calculate ANOVA for genotype effects
  calculate_anova: true

  # Calculate heritability (if not already done in QC)
  calculate_heritability: true

  # Significance level for ANOVA
  alpha: 0.05

# PCA configuration
pca:
  # Number of PCs to retain (should match QC config)
  n_components: 0.75

  # Standardize traits before PCA
  standardize: true

  # Feature selection strategy: "extreme" or "top_variance"
  # "extreme" = select traits with most extreme positive AND negative PC loadings
  # "top_variance" = select traits with highest total variance contribution
  feature_selection_strategy: "extreme"

  # Number of traits to select using the strategy above (for UMAP coloring and metadata)
  # For "extreme" strategy: 5 means 5 per direction per PC (can select many traits)
  # These are the traits that will be used to color UMAP plots
  n_top_features: 5

umap:
  # Enable UMAP dimensionality reduction (recommended for n ≥ 15)
  enabled: true

  # Number of neighbors for UMAP (affects local vs global structure)
  # Recommended: min(15, n_samples // 4). For ~40 samples: 10. For 150+ samples: 15.
  n_neighbors: 10

  # Minimum distance between points in UMAP embedding
  min_dist: 0.1

  # Distance metric: "euclidean", "manhattan", "cosine"
  metric: "euclidean"

  # Random seed for reproducibility
  random_state: 42

clustering:
  # Enable clustering analysis
  enabled: false

# Heritability filtering (usually already done in QC; set enabled: false here)
heritability:
  enabled: false
  threshold: 0.30

interesting_genotypes:
  # Enable automatic detection of interesting genotypes
  enabled: true

  # Methods for detecting interesting genotypes:
  # pc_extreme = genotypes with extreme PC scores
  # trait_extreme = genotypes with extreme trait values
  # heritable_extreme = genotypes with extreme values for heritable traits
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme

  # PC threshold for pc_extreme method (in standard deviations)
  pc_threshold: 2.0

  # Percentile threshold for trait_extreme method (top/bottom N%)
  trait_percentile: 95.0

  # Minimum heritability for heritable_extreme method
  min_heritability: 0.30

  # Maximum genotypes to report (if more are detected, top N are kept)
  max_genotypes: 6

  # Generate image grids for interesting genotypes (requires image_dir)
  generate_image_grids: true

  # Number of images to show per genotype in the grid
  images_per_genotype: 9

adaptive_sizing:
  # Enable adaptive figure sizing
  enabled: true

  # Base size and scaling
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0

  # Bounds
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  # Enable static (non-interactive) visualizations
  enabled: true

  # Output formats for static plots
  formats:
    - png
    - pdf

  # DPI for static plots (300 = publication quality)
  dpi: 300

  # Which plot types to create
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true

  # Number of trait arrows to show on PCA biplot (keep small to avoid crowding)
  # For "extreme" strategy: 1 = 2 arrows per PC (one positive, one negative)
  # For high-dimensional data (>100 traits), use 1. For <50 traits, can use up to 5.
  pca_biplot_top_features: 1

interactive_viz:
  # Enable interactive (Plotly) visualizations
  enabled: true

  # Which interactive plot types to create
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false

  # Show images on hover in interactive plots (requires image_dir)
  show_images_on_hover: true

dashboard:
  # Enable dashboard generation (experimental)
  enabled: false

summary:
  # Enable summary report generation
  enabled: true

  # Summary output formats
  formats:
    - markdown
    - json

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Write logs to a file
  log_to_file: true
  log_file: "viz_pipeline.log"
