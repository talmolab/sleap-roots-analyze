# Visualization Pipeline Configuration: Javier TTC-SALK Soybean — BRIGHTNESS RETRAIN (2026-05-04)
#
# Dataset: QC output from qc/javier_ttc_salk_soybean_brightness.yaml
# Analysis date: 2026-05-04
# Adapted from: viz/javier_ttc_salk_soybean.yaml (the Apr-8 deployed_2022 baseline run)
#
# Note: csv_path will be auto-updated to QC output when run via run-all.
# image_dir unchanged (same source images for all conditions).

pipeline_name: "javier_ttc_salk_soybean_brightness"
version: "1.0"

data:
  csv_path: "WILL_BE_AUTO_UPDATED_BY_RUN_ALL"
  image_dir: "Z:/users/eberrigan/20260401_Javier_Martinez_Pacheco_TTC_SALK_Soybean/images_downloader_output"

columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: "Replicate"
  image_path: null

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

pca:
  n_components: 0.75
  standardize: true
  feature_selection_strategy: "extreme"

umap:
  enabled: true
  n_neighbors: 15
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

clustering:
  enabled: false

heritability:
  enabled: false
  threshold: 0.0

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30
  max_genotypes: 6
  generate_image_grids: true
  images_per_genotype: 9

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 150
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: false
  create_trait_correlations: false
  create_heritability_plots: true
  create_genotype_comparisons: false
  pca_biplot_top_features: 1

interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  show_images_on_hover: true

dashboard:
  enabled: false

summary:
  enabled: true
  formats:
    - markdown
    - json

logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"
