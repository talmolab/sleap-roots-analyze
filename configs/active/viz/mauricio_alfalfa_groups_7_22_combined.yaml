# Visualization Pipeline Configuration: Mauricio Alfalfa GWAS Groups 7-22 Combined
#
# Dataset: QC output from qc/mauricio_alfalfa_groups_7_22_combined.yaml
# Analysis date: 2026-08-20
# Generated from: viz_template_no_images.yaml
#
# Note: csv_path will be auto-updated to QC output when run via run-all.
#
# Key choices:
#   image_dir: null -- the 15 new groups' images live in 15 separate
#     experiment folders with no single unified path; per-group prediction
#     viewers already exist separately for visual review. User confirmed
#     skipping image-linked viz for this combined run.
#   pca.n_components: 0.75 -- matches April's Groups 1-6 choice, for biplot
#     interpretability (template default is 0.95).
#   statistics.calculate_heritability: true (template default, unchanged) --
#     this is what actually drives H²/BLUP computation and
#     08_blup_adjusted_means.csv output (generate_blup_table defaults true).
#     Distinct from the heritability.enabled/threshold block below, which is
#     QC-side trait-filtering config reused here for viz-side diagnostics
#     only -- does not gate BLUP generation.
#   PCA biplot geographic coloring: NOT configured -- Mauricio has not yet
#     provided a genotype-to-origin passport file (Bloom's accessions table
#     has no geographic fields). Follow-up once received.

pipeline_name: "mauricio_alfalfa_groups_7_22_combined_viz"
version: "1.0"

data:
  csv_path: "FILL_IN_CSV_PATH"
  image_dir: null

columns:
  barcode: "Barcode"
  genotype: "Genotype"
  replicate: null  # cylinder data has no replicate factor -- matches QC config's omission (issue #142: replicate values are never used in the model)
  image_path: null

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05
  # generate_blup_table defaults true; not set explicitly since the default
  # already produces 08_blup_adjusted_means.csv whenever calculate_heritability
  # is true.

pca:
  n_components: 0.75
  standardize: true
  feature_selection_strategy: "extreme"

umap:
  enabled: true
  n_neighbors: 15
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

clustering:
  enabled: false

heritability:
  enabled: false
  threshold: 0.30

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30
  max_genotypes: 6
  generate_image_grids: false
  images_per_genotype: 9

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true
  pca_biplot_top_features: 1

interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  show_images_on_hover: false

dashboard:
  enabled: false

summary:
  enabled: true
  formats:
    - markdown
    - json

logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"
