# Visualization Pipeline Configuration: Alfalfa GWAS Wave 1 (Grouped by Timepoint)
#
# Dataset: Mauricio Chiurazzi Alfalfa GWAS wave 1 (Dec 2025)
# Source: QC pipeline output from qc_alfalfa_gwas_wave_1_grouped.yaml
#
# Note: When run via run-all, csv_path is auto-updated to the QC pipeline output.

pipeline_name: "viz_alfalfa_gwas_wave_1_grouped"
version: "1.0"

data:
  # Day 9 QC output (plant_age_days=9). See run_manifest header for per-timepoint workaround.
  csv_path: "Z:/users/eberrigan/20251213_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_Dec2025/sleap-roots-analyze-output/2026-02-17_114013/qc/plant_age_days_9_20260217_115042/10_final_data.csv"
  image_dir: "Z:/users/eberrigan/20251213_Mauricio_Chiurazzi_Alfalfa_GWAS_wave_1_Dec2025/images_downloader_output/images"

# Column names after QC pipeline sanitization
columns:
  barcode: "Barcode"         # Sanitized from plant_qr_code
  genotype: "Genotype"       # Sanitized from accession_id
  replicate: "Replicate"     # Sanitized from plant_id
  image_path: null           # No pre-computed image paths; matched from image_dir by barcode

statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

# PCA configuration
# feature_selection_strategy "extreme" always selects exactly 1 most-positive
# and 1 most-negative loading trait per retained PC for PCAAnalysisStep's
# metadata/top_features output — n_top_features is not read for this strategy
# (see PCAConfig.n_top_features docstring). It does NOT control the "UMAP
# colored by top traits" plot, which always shows 6 traits (n_traits is
# hardcoded in GenerateStaticFiguresStep), round-robin distributed across all
# retained PCs and both loading directions.
# pca_biplot_top_features (in static_viz) independently controls biplot arrow count.
pca:
  n_components: 0.95
  standardize: true
  feature_selection_strategy: "extreme"

umap:
  enabled: true
  n_neighbors: 10              # Smaller N for ~40 samples per timepoint group
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

clustering:
  enabled: false

# Heritability filtering already applied in QC at H² >= 0.30
heritability:
  enabled: false
  threshold: 0.30

interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme
    - trait_extreme
    - heritable_extreme
  pc_threshold: 2.0
  trait_percentile: 95.0
  min_heritability: 0.30       # Matches QC heritability threshold
  max_genotypes: 6             # Max equals total genotype count
  generate_image_grids: true
  images_per_genotype: 9

adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true
  # 1 per extreme direction = 2 arrows per PC on the biplot (positive + negative)
  pca_biplot_top_features: 1

interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: true
  create_cluster_plots: false
  show_images_on_hover: true   # Requires image_dir

dashboard:
  enabled: false

summary:
  enabled: true
  formats:
    - markdown
    - json

logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"
