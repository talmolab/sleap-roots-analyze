# Visualization Pipeline Configuration: Root Coring (Field/EDPIE)
#
# Platform: Field trials with root coring and above-ground traits
# Input: Cleaned trait data from QC pipeline (qc_root_core_edpie)
#
# Features:
# - PCA analysis with top feature identification
# - Statistical analysis (ANOVA, heritability)
# - Static and interactive visualizations
# - Interesting genotype identification
# - Trait distributions and correlations
# - Depth profile visualizations (if supported)
#
# Notes:
# - Data includes both root core (below-ground) and above-ground traits merged by QC
# - May include depth-profiled measurements
#
# Source: QC pipeline output from qc_root_core_edpie.yaml
#         Based on trait_viz_root_coring_20251130.ipynb

# Pipeline metadata
pipeline_name: "viz_root_coring"
version: "1.0"

# Data configuration
data:
  # Path to cleaned trait data from QC pipeline
  csv_path: "qc_runs/EDPIE Root Core Full QC_20251215_121943/10_final_data.csv"

  # Optional: Directory containing root images for hover visualization
  image_dir: null

  # Exclude additional metadata columns from trait analysis (matching root coring data structure)
  additional_exclude_cols: ["Ent", "Sub", "Cross name", "Sel_Hist", "Origin", "Cid", "Sid", "GID", "core_id", "plant_identifier"]

# Column names (post-sanitization from QC pipeline)
columns:
  barcode: "Barcode"          # Sanitized from original barcode column
  genotype: "Genotype"         # Sanitized from original geno column
  replicate: "Replicate"       # Sanitized from original rep column
  image_path: "image_path"     # Column containing image paths (if using image hover)

# Statistics configuration
statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

# PCA configuration (matching notebook)
pca:
  n_components: 0.75             # Keep components explaining 75% variance (matches notebook)
  standardize: true
  feature_selection_strategy: "extreme"  # 1 most-positive + 1 most-negative trait per retained PC (n_top_features not read)

# UMAP configuration (disabled by default, matching notebook parameters)
umap:
  enabled: false
  n_neighbors: 8              # Matches notebook UMAP_N_NEIGHBORS
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

# Clustering configuration (disabled by default)
clustering:
  enabled: false

# Heritability filtering (optional - traits already filtered by QC)
heritability:
  enabled: false               # Traits already filtered by QC pipeline
  threshold: 0.50              # Matches notebook HERITABILITY_THRESHOLD

# Interesting genotypes identification (matching notebook)
interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme               # Extreme in PC space
    - trait_extreme            # Extreme per-trait values
    - heritable_extreme        # Extreme + heritable traits
  pc_threshold: 2.5            # Z-score threshold for PC extremes (matches notebook EXTREME_PC_N_STD)
  trait_percentile: 95.0       # Percentile for trait extremes
  min_heritability: 0.50       # Minimum H² for heritable extremes (matches notebook HERITABILITY_THRESHOLD)
  max_genotypes: 10            # Max genotypes per method
  generate_image_grids: true   # Create image grids (requires image_dir)
  images_per_genotype: 9       # Images per genotype in grid

# Adaptive figure sizing
adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

# Static visualization settings
static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true

  # PCA biplot feature control
  # With "extreme" method: shows N most positive + N most negative for EACH PC axis
  # So pca_biplot_top_features: 1 gives up to 4 features (1×2 directions × 2 PCs)
  pca_biplot_top_features: 1  # Show extreme loadings for both PC1 and PC2 (matches notebook)

  # Genotype highlighting (optional) - two-tier system for emphasis
  #
  # genotypes_to_color: List of genotypes to color distinctly in PCA plots
  #   - All listed genotypes get unique colors from the palette
  #   - Other genotypes are shown in gray as "Other"
  #   - Set to null or [] to color all genotypes (default behavior)
  #   - Example use case: Focus on specific lines of interest in a large panel
  genotypes_to_color: ["GH_7418", "GH_7371", "GH_7417"]  # Matches notebook GENOTYPES_TO_COLOR

  # highlight_genotypes: List of genotypes to emphasize with special formatting
  #   - Larger points (150 vs 50 for regular points)
  #   - Black edge colors for visibility
  #   - Bold, colored labels in PC boxplots
  #   - Works independently of genotypes_to_color
  #   - Set to null or [] to disable highlighting
  #   - Example use case: Mark your positive/negative controls or extreme phenotypes
  highlight_genotypes: ["GH_7418", "GH_7371", "GH_7417"]  # Matches notebook GENOTYPES_TO_HIGHLIGHT

# Interactive visualization settings
interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  show_images_on_hover: true   # Requires image_dir

# Dashboard generation (disabled by default)
dashboard:
  enabled: false

# Summary report
summary:
  enabled: true
  formats:
    - markdown
    - json

# Logging
logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_pipeline.log"