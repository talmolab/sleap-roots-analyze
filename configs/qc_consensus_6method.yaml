# QC Pipeline Configuration: 6-Method Consensus (Robust Full Consensus)
#
# This preset uses all 6 outlier detection methods with consensus voting.
# Best for: Critical datasets, publication-quality QC, maximum robustness
#
# Performance: Slower (~6x detection time vs single method)
# Robustness: Maximum (outliers must be flagged by ≥3 out of 6 methods)

# Pipeline metadata
pipeline_name: "qc_consensus_6method"
version: "1.0"

# Data configuration
data:
  csv_path: ???  # REQUIRED: Path to your trait CSV file
  image_dir: null  # Optional: Directory containing root images

# Column names
columns:
  barcode: "Barcode"
  genotype: "geno"
  replicate: "rep"

# Data cleanup thresholds
cleanup:
  max_zeros_per_trait: 0.5
  max_nans_per_trait: 0.3
  max_nan_fraction: 0.1
  min_samples_per_trait: 10

# Outlier detection - ALL 6 METHODS
outlier_detection:
  # Traditional methods (3)
  traditional_methods:
    - pca                  # PCA reconstruction error
    - isolation_forest     # Tree-based anomaly detection
    - mahalanobis          # Parametric distance-based

  # Clustering methods (3)
  clustering_methods:
    - kmeans               # K-Means outlier detection
    - gmm                  # Gaussian Mixture Model
    - hierarchical         # Hierarchical clustering

  # Method-specific settings (use defaults for most)
  pca:
    explained_variance: 0.95
    threshold: 2.5

  isolation_forest:
    contamination: 0.1

  mahalanobis:
    variance_threshold: 0.95
    use_chi_squared: true
    chi2_percentile: 99.0

  kmeans:
    n_clusters: null  # Auto-optimize
    max_clusters: 10
    distance_threshold: 2.0

  gmm:
    n_components: null  # Auto-select via BIC
    max_components: 5
    percentile_threshold: 99.0

  hierarchical:
    n_clusters: null  # Auto-optimize
    linkage_method: "ward"
    distance_threshold: 2.0

# Outlier removal - CONSENSUS VOTING
outlier_removal:
  strategy: "subset"      # Require minimum number of methods
  min_methods: 3          # Remove if ≥3 out of 6 methods agree (50%)

# PCA configuration
pca:
  n_components: 0.95
  feature_selection_strategy: "top_variance"

# Heritability filtering
heritability:
  enabled: true
  threshold: 0.5
  generate_diagnostics: false  # Generate detailed diagnostic plots and CSV for removed traits

# Visualization settings
visualization:
  dpi: 300
  figsize: [12, 10]  # Larger for multi-method comparisons

# Logging
logging:
  level: "INFO"
  log_to_file: true
  log_file: "pipeline.log"