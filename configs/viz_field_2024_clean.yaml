# Visualization Pipeline Configuration: Field 2024 Clean (Pre-aggregated)
#
# Platform: Field trials with pre-aggregated root + above-ground traits
# Input: Cleaned trait data from QC pipeline (qc_field_2024_clean)
#
# Features:
# - PCA analysis with top feature identification
# - Statistical analysis (ANOVA, heritability)
# - Static and interactive visualizations
# - Interesting genotype identification
# - Trait distributions and correlations
#
# Notes:
# - Data was pre-aggregated by data provider (Field_2024_clean.csv)
# - Includes both root (below-ground) and above-ground traits
# - Uses same parameters as root coring viz for consistency
#
# Source: QC pipeline output from qc_field_2024_clean.yaml

# Pipeline metadata
pipeline_name: "viz_field_2024_clean"
version: "1.0"

# Data configuration
data:
  # Path to cleaned trait data from QC pipeline
  # NOTE: Update this path after running the QC pipeline
  csv_path: "qc_runs/Field 2024 Clean (Pre-aggregated)_20251215_122042/10_final_data.csv"

  # Optional: Directory containing root images for hover visualization
  image_dir: null

  # Exclude additional metadata columns from trait analysis
  additional_exclude_cols: ["plant_identifier"]

# Column names (post-sanitization from QC pipeline)
columns:
  barcode: "Barcode"          # Sanitized from original barcode column
  genotype: "Genotype"         # Sanitized from original geno column
  replicate: "Replicate"       # Sanitized from original rep column
  image_path: "image_path"     # Column containing image paths (if using image hover)

# Statistics configuration
statistics:
  calculate_anova: true
  calculate_heritability: true
  alpha: 0.05

# PCA configuration (matching field data analysis)
pca:
  n_components: 0.75             # Keep components explaining 75% variance
  standardize: true
  feature_selection_strategy: "extreme"  # Show extreme loadings
  n_top_features: 1              # Top features for biplot

# UMAP configuration (disabled by default)
umap:
  enabled: false
  n_neighbors: 8
  min_dist: 0.1
  metric: "euclidean"
  random_state: 42

# Clustering configuration (disabled by default)
clustering:
  enabled: false

# Heritability filtering (optional - traits already filtered by QC)
heritability:
  enabled: false               # Traits already filtered by QC pipeline
  threshold: 0.50              # Matches QC config heritability threshold

# Interesting genotypes identification
interesting_genotypes:
  enabled: true
  methods:
    - pc_extreme               # Extreme in PC space
    - trait_extreme            # Extreme per-trait values
    - heritable_extreme        # Extreme + heritable traits
  pc_threshold: 2.5            # Z-score threshold for PC extremes
  trait_percentile: 95.0       # Percentile for trait extremes
  min_heritability: 0.50       # Minimum H^2 for heritable extremes
  max_genotypes: 10            # Max genotypes per method
  generate_image_grids: false  # No images available
  images_per_genotype: 9       # Images per genotype in grid

# Adaptive figure sizing
adaptive_sizing:
  enabled: true
  base_width: 8.0
  base_height: 6.0
  width_per_item: 2.0
  height_per_item: 2.0
  min_width: 6.0
  max_width: 20.0
  min_height: 4.0
  max_height: 16.0

# Static visualization settings
static_viz:
  enabled: true
  formats:
    - png
    - pdf
  dpi: 300
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  create_trait_distributions: true
  create_trait_correlations: true
  create_heritability_plots: true
  create_genotype_comparisons: true

  # PCA biplot feature control
  pca_biplot_top_features: 1  # Show extreme loadings for both PC1 and PC2

  # Genotype highlighting (optional) - set after identifying interesting genotypes
  genotypes_to_color: null  # Set to list of genotypes to color distinctly
  highlight_genotypes: null  # Set to list of genotypes to emphasize

# Interactive visualization settings
interactive_viz:
  enabled: true
  create_pca_plots: true
  create_umap_plots: false
  create_cluster_plots: false
  show_images_on_hover: false  # No images available

# Dashboard generation (disabled by default)
dashboard:
  enabled: false

# Summary report
summary:
  enabled: true
  formats:
    - markdown
    - json

# Logging
logging:
  level: "INFO"
  log_to_file: true
  log_file: "viz_field_2024_clean.log"
