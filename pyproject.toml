[project]
name = "sleap-roots-analyze"
version = "0.1.0a1"
description = "Analyze, visualize, and interpret root traits output from sleap-roots."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "eberrigan", email = "eberrigan@salk.edu" }
]
requires-python = ">=3.11"
keywords = ["sleap", "roots", "phenotyping", "plant-science", "trait-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "adjustText>=1.3.0",
    "click>=8.0.0",
    "matplotlib>=3.10.6",
    "networkx>=3.5",
    "numpy>=2.3.2",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.3.2",
    "pillow>=11.0.0",
    "plotly>=6.3.0",
    "rich>=13.0.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "umap-learn>=0.5.9.post2",
]

[project.urls]
Homepage = "https://github.com/talmolab/sleap-roots-analyze"
Repository = "https://github.com/talmolab/sleap-roots-analyze"
Issues = "https://github.com/talmolab/sleap-roots-analyze/issues"
Changelog = "https://github.com/talmolab/sleap-roots-analyze/blob/main/docs/CHANGELOG.md"

[project.scripts]
sleap-roots-analyze = "sleap_roots_analyze.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.3.0",
    "ipykernel>=6.29.5,<7.0.0",
    "ipython>=9.5.0",
    "nbformat>=5.10.4",
    "pydocstyle>=6.3.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.11",
    "toml>=0.10.2",
]

[tool.black]
line-length = 88

[tool.ruff.lint]
select = [
    "D",  # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (slow, run real pipelines)",
]
